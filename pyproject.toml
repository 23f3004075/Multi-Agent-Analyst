[project]
name = "enterprise-sql-agent"
version = "0.1.0"
description = "Enterprise Multi-Agent NL-to-SQL & Autonomous BI Engine with Adaptive Model Routing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # --- Orchestration ---
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # --- LLM Clients ---
    "litellm>=1.40",
    "sentence-transformers>=3",
    # --- Database ---
    "duckdb>=1.1",
    "sqlglot>=25",
    # --- Guardrails ---
    "nemoguardrails>=0.10",
    # --- Data Processing ---
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    # --- Visualization ---
    "plotly>=5.22",
    "kaleido>=0.2",
    # --- Report Generation ---
    "weasyprint>=62",
    "xlsxwriter>=3.2",
    "jinja2>=3.1",
    # --- API & Serving ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    # --- Observability ---
    "langfuse>=2",
    # --- Config & Validation ---
    "pydantic>=2.7",
    "pydantic-settings>=2",
    # --- HTTP ---
    "httpx>=0.27",
    # --- Cache ---
    "redis>=5",
    # --- Utilities ---
    "python-dotenv>=1.0",
    "rich>=13",
    "reportlab>=5.0.1",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]
eval = [
    "deepeval>=1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
